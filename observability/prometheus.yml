global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  # honor_labels: o job de cada série é o serviço (fix-bff, fix-backend), não o nome do scrape.
  - job_name: "fix-services"
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
