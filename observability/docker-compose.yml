services:
  # OpenTelemetry Collector: ponto único de entrada para traces e métricas (OTLP gRPC e HTTP)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: fix-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (Backend .NET, etc.)
      - "4318:4318"   # OTLP HTTP (BFF Node.js, Web Vue, etc.)
      - "8888:8888"   # Métricas internas do próprio OTel Collector
      - "8889:8889"   # Endpoint Prometheus exposto pelo OTel Collector
    depends_on:
      - jaeger
    networks:
      - fix-network

  # Jaeger: armazenamento e interface visual de Tracing Distribuído
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fix-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
    networks:
      - fix-network

  # Prometheus: raspagem e armazenamento de séries temporais de métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: fix-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"   # exemplars: pontos nos gráficos de latência que abrem o trace
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fix-prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus Web UI & API
    depends_on:
      - otel-collector
    networks:
      - fix-network

  # Grafana: visualização unificada de métricas e traces
  grafana:
    image: grafana/grafana:13.2.2
    container_name: fix-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # Só as fontes de dados são provisionadas; os dashboards entram pela API (grafana-seed) para serem editáveis.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - fix-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # Grafana UI na porta 3001 (evita conflito com o BFF na 3000)
    depends_on:
      - prometheus
      - jaeger
    networks:
      - fix-network

  # Semeia os dashboards de grafana/dashboards pela API e termina. Só cria o que não existe: o que foi salvo pela
  # interface fica. Para levar uma edição ao repositório, exporte o JSON para grafana/dashboards/.
  grafana-seed:
    image: curlimages/curl:8.17.0
    container_name: fix-grafana-seed
    restart: "no"
    entrypoint: ["sh", "/seed-dashboards.sh"]
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USER=admin
      - GRAFANA_PASSWORD=admin
      - DASHBOARDS_DIR=/dashboards
    volumes:
      - ./grafana/seed-dashboards.sh:/seed-dashboards.sh:ro
      - ./grafana/dashboards:/dashboards:ro
    depends_on:
      - grafana
    networks:
      - fix-network

volumes:
  fix-prometheus-data:
  fix-grafana-data:

networks:
  fix-network:
    name: fix-network
    driver: bridge
