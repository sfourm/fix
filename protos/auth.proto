syntax = "proto3";

package fix.v1;

option csharp_namespace = "Fix.Contracts.V1";

import "common.proto";

// Identity do core. O BFF usa Authenticate para validar credenciais e, a partir do usuário
// retornado, emite a própria sessão/token para o front.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Authenticate(AuthenticateRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message AuthenticateRequest {
  string email = 1;
  string password = 2;
}

message GetUserRequest {
  RequestContext context = 1;
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  repeated string roles = 4;
}
