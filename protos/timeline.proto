syntax = "proto3";

package fix.v1;

option csharp_namespace = "Fix.Contracts.V1";

import "google/protobuf/timestamp.proto";
import "common.proto";

// Trilha de auditoria da organização. Exige context.user_id e context.organization_id.
service TimelineService {
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
}

message GetTimelineRequest {
  RequestContext context = 1;
  optional string entity_type = 2; // ex.: "Policy", "Mandate", "Order", "OrganizationMember"
  optional string entity_id = 3;
  int32 limit = 4;
  optional string action = 5;        // Created | Updated | Deleted
  optional string author_id = 6;
  optional string occurred_from = 7; // ISO 8601 (inclusive)
  optional string occurred_to = 8;   // ISO 8601 (exclusive)
  optional string search = 9;        // texto nos valores alterados ou no id da entidade
  PageRequest page = 10;             // paginado: a resposta traz page com o total (sem page, vale limit)
}

message TimelineEntry {
  string id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string action = 4;       // Created | Updated | Deleted
  string changes_json = 5; // valores (Created/Deleted) ou { campo: { old, new } } (Updated)
  optional string author_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

message GetTimelineResponse {
  repeated TimelineEntry entries = 1;
  PageInfo page = 2; // presente quando o pedido veio paginado
}
