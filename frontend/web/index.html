<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d1d1f'/%3E%3Ctext x='16' y='21.5' font-size='15' font-family='-apple-system,Segoe UI,sans-serif' font-weight='700' fill='%23d9a441' text-anchor='middle'%3EFIX%3C/text%3E%3C/svg%3E" />
    <title>FIX</title>
    <script>
      // Tema antes da primeira pintura (sem "piscar" claro ao abrir no escuro). Preferência salva pelo seletor de tema.
      (function () {
        var mode = 'system';
        try {
          mode = JSON.parse(localStorage.getItem('fix.theme')) || 'system';
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
