<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIX · Gestão comercial e de risco · v60</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
 --bg:#F3F5F8;--ink:#FFF;--ink2:#F5F7FA;--ink3:#EAEEF3;--line:#E6EAF0;--line2:#D8DEE7;
 --sugar:#1A2432;--dim:#465364;--mut:#67758B;--mut2:#98A4B6;
 --gold:#B07E12;--goldS:rgba(176,126,18,.10);--cane:#1E9D66;--caneS:rgba(30,157,102,.10);
 --clay:#CE5138;--clayS:rgba(206,81,56,.09);--blue:#3468C0;--steel:#5D7188;--bronze:#8A6A34;
 --r:10px;--rl:14px;--sh:0 1px 2px rgba(20,28,40,.04),0 2px 8px rgba(20,28,40,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--sugar);font:14px 'IBM Plex Sans','Segoe UI',sans-serif;display:flex;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--cane)}.neg{color:var(--clay)}.mut{color:var(--mut2)}
aside{width:238px;flex:none;border-right:1px solid var(--line);background:var(--ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0}
.brand{padding:0 22px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand h1{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:2px;color:var(--gold)}
.brand h1 span{font-size:13px;color:var(--mut);letter-spacing:0}
.brand small{display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:4px}
nav .sec{padding:14px 22px 6px;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut2);font-weight:600}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 22px;font-size:13.5px;color:var(--mut);cursor:pointer;border-left:2px solid transparent}
nav a:hover{color:var(--sugar);background:var(--ink2)}
nav a.on{color:var(--sugar);border-left-color:var(--gold);font-weight:600;background:linear-gradient(90deg,var(--goldS),transparent)}
nav a .cnt{font-family:'IBM Plex Mono';font-size:11px;color:var(--mut2)}
nav a.trail{padding:3px 10px 3px 36px;font-size:11.5px;color:var(--mut);position:relative}
nav a.trail::before{content:'\21b3';position:absolute;left:22px;color:var(--gold);font-size:10px}
nav a.trail.on{color:var(--gold);font-weight:600;border-left-color:transparent;background:none}
nav a.child{padding-left:34px;font-size:12.5px;opacity:.85;position:relative}
nav a.child::before{content:'-';position:absolute;left:24px;color:var(--gold)}
nav a.child.on{opacity:1}
main{flex:1;min-width:0;height:100vh;overflow:auto}
.top{display:flex;align-items:center;gap:12px;padding:12px 30px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);z-index:20}
.back{border:1px solid var(--line2);background:var(--ink);width:30px;height:30px;border-radius:var(--r);font-size:15px;cursor:pointer}
.back:disabled{opacity:.3}
.crumb{flex:1;display:flex;gap:7px;font-size:12px;flex-wrap:wrap}
.crumb a{color:var(--mut);cursor:pointer}.crumb a:hover{color:var(--gold)}
.crumb .sep{color:var(--mut2)}.crumb .cur{color:var(--sugar);font-weight:600}
.mktbar{display:flex;gap:16px;font-family:'IBM Plex Mono';font-size:11px;color:var(--mut)}
.mktbar b{color:var(--sugar)}
.wrap{padding:24px 30px;max-width:1480px}
.kick{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
h2.page{font-family:'Fraunces',serif;font-size:27px;font-weight:500;letter-spacing:-.5px;margin:5px 0 16px}
.lead{color:var(--mut);font-size:13px;max-width:840px;margin:-6px 0 16px;line-height:1.6}
.kpis{display:flex;flex-wrap:wrap;background:var(--ink);border:1px solid var(--line);margin-bottom:16px;border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden}
.kpi{flex:1;min-width:170px;padding:14px 18px;border-left:1px solid var(--line);border-top:2px solid var(--gold)}
.kpi:first-child{border-left:0}
.kpi label{display:block;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font-family:'IBM Plex Mono';font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.6px;white-space:nowrap}
.kpi small{display:block;font-size:11px;color:var(--mut);margin-top:4px}
.kpi.click{cursor:pointer}.kpi.click:hover{background:var(--ink2)}
.sec1{margin-top:16px;background:var(--ink);border:1px solid var(--line);padding:15px 17px;border-radius:var(--rl);box-shadow:var(--sh)}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--line2);margin-bottom:12px;gap:14px}
.sh h3{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600}
.sh .meta{font-size:11.5px;color:var(--mut2);text-align:right}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:center;font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 10px 7px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
td{text-align:center;padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{text-align:left}
tr.row{cursor:pointer}tr.row:hover td{background:var(--ink2)}
td .sub{display:block;font-size:10.5px;color:var(--mut2);margin-top:2px}
.chip{display:inline-block;font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);background:var(--ink)}
.chip.g{color:var(--cane);border-color:rgba(30,157,102,.35);background:var(--caneS)}
.chip.r{color:var(--clay);border-color:rgba(206,81,56,.35);background:var(--clayS)}
.chip.a{color:var(--gold);border-color:rgba(176,126,18,.35);background:var(--goldS)}
.chip.b{color:var(--blue);border-color:rgba(52,104,192,.3);background:rgba(52,104,192,.08)}
.idl{color:var(--blue);border-bottom:1px dotted rgba(52,104,192,.4);cursor:pointer}
.idl:hover{color:var(--gold)}
.dl{font-size:13px}
.dl div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.dl div:last-child{border-bottom:0}
.dl dt{color:var(--mut)}.dl dd{font-family:'IBM Plex Mono';text-align:right}
.integ{border-left:2px solid var(--gold);padding:9px 12px;margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.6;background:var(--goldS);border-radius:0 var(--r) var(--r) 0}
.hint{font-size:11px;color:var(--mut2);margin-top:8px}
.empty{padding:26px 0;text-align:center;color:var(--mut2);font-size:13px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#FFF;font:600 12.5px 'IBM Plex Sans';padding:8px 16px;border-radius:var(--r);cursor:pointer}
.btn.ghost{background:var(--ink);color:var(--sugar);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.acts{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:16px;align-items:start}
@media(max-width:1240px){.form{grid-template-columns:1fr}}
.fset{background:var(--ink);border:1px solid var(--line);padding:15px 17px;margin-top:14px;border-radius:var(--rl);box-shadow:var(--sh)}
.fset:first-child{margin-top:0}
.fleg{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.fleg b{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600}
.fleg .n{font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:var(--gold);border:1px solid rgba(176,126,18,.35);background:var(--goldS);padding:1px 7px;border-radius:20px}
.fleg span{font-size:11.5px;color:var(--mut2)}
.frow{display:grid;gap:12px 16px;margin-bottom:12px}
.f2{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1fr}.f4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:860px){.f2,.f3,.f4{grid-template-columns:1fr}}
.fld label{display:block;font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:5px}
.fld label i{font-style:normal;color:var(--clay)}
.inp{display:flex;border:1px solid var(--line2);background:var(--ink);border-radius:var(--r);overflow:hidden}
.inp:focus-within{border-color:var(--gold)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;color:var(--sugar);font-family:'IBM Plex Mono';font-size:14px;padding:9px 11px;outline:0}
.inp select,.inp input.txt{font-family:'IBM Plex Sans';font-size:13.5px}
.inp .un{display:flex;align-items:center;padding:0 10px;font-family:'IBM Plex Mono';font-size:11px;color:var(--mut);border-left:1px solid var(--line);background:var(--ink2);white-space:nowrap}
.echo{font-family:'IBM Plex Mono';font-size:11px;color:var(--dim);margin-top:5px}
.rail{position:sticky;top:70px;background:var(--ink);border:1px solid var(--line);padding:15px 17px;border-radius:var(--rl);box-shadow:var(--sh)}
.rail h4{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.delta{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.delta:last-of-type{border-bottom:0}
.delta .k{color:var(--mut)}.delta .v{font-family:'IBM Plex Mono';white-space:nowrap;text-align:right}
.rail .warn{border-left:2px solid var(--clay);background:var(--clayS);padding:9px 11px;margin-top:12px;font-size:11.5px;line-height:1.5;border-radius:0 var(--r) var(--r) 0}
.rail .ok{border-left:2px solid var(--cane);background:var(--caneS);padding:9px 11px;margin-top:12px;font-size:11.5px;line-height:1.5;border-radius:0 var(--r) var(--r) 0}
.ffoot{display:flex;gap:12px;align-items:center;margin-top:14px;background:var(--ink);border:1px solid var(--line);padding:13px 16px;border-radius:var(--rl)}
.ffoot .note{font-size:11px;color:var(--mut2)}
.entgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.entgrid{grid-template-columns:1fr 1fr}}
.ent{background:var(--ink);border:1px solid var(--line);border-radius:var(--rl);padding:13px 15px;cursor:pointer;box-shadow:var(--sh)}
.ent:hover{border-color:var(--gold)}
.ent .eh{display:flex;justify-content:space-between;align-items:center}
.ent .eh label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:650;display:flex;align-items:center;gap:6px}
.ent .pic{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:10px}
.ent b{display:block;font-family:'IBM Plex Mono';font-size:19px;font-weight:600;margin-top:8px}
.ent small{display:block;font-size:10.5px;color:var(--mut2);margin-top:4px;line-height:1.4}
.ent small.gap{font-size:11.5px;font-weight:650;margin-top:5px}
.ent small.gap.neg{color:var(--clay)}
.ent small.gap.pos{color:var(--cane)}
.p-fis{background:rgba(93,113,136,.14);color:var(--steel)}
.p-pre{background:var(--goldS);color:var(--gold)}
.p-fre{background:rgba(138,106,52,.14);color:var(--bronze)}
.p-moe{background:var(--caneS);color:var(--cane)}
.vinc{display:inline-flex;align-items:center;gap:7px;margin:3px 6px 3px 0;padding:3px 9px;border:1px solid var(--line);border-radius:20px;font-size:11px;color:var(--mut);cursor:pointer}
.vinc:hover{border-color:var(--gold);color:var(--sugar)}
.vinc .id{font-family:'IBM Plex Mono';font-weight:600;color:var(--gold)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--sugar);color:#FFF;font-weight:600;font-size:13px;padding:10px 22px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.funil{display:flex;align-items:stretch;margin:4px 0 2px}
.fs{flex:1;position:relative;padding:10px 12px 10px 20px;background:var(--ink2);cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.fs:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:9px 0 0 9px;padding-left:13px}
.fs:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 9px 9px 0}
.fs:hover{background:var(--goldS)}
.fs label{display:block;font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);font-weight:600}
.fs b{font-family:'IBM Plex Mono';font-size:14.5px}
.fs small{display:block;font-size:9.5px;color:var(--mut2)}
.fs .fpct{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--mut);margin-top:2px}
.fs .fpct b{display:inline;font-size:10.5px;color:var(--gold)}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.mrow:hover{background:var(--ink2)}
.mrow .nm{width:180px;font-weight:600;display:flex;align-items:center;gap:7px}
.mrow .pb{flex:1;background:var(--ink3);border-radius:5px;height:8px}.mrow .pb i{display:block;height:8px;border-radius:5px}
.mktrow{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding-top:4px}
.mktrow b{color:var(--sugar)}
.est{display:inline-block;font-family:'IBM Plex Mono';font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:1px 7px;border-radius:20px;border:1px solid rgba(30,157,102,.3);color:var(--cane)}
/* v60 · trilha do fluxo — cadeia de relações no topo das telas do processo */
.chain{display:flex;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:11px}
.chstep{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line2);background:var(--ink);border-radius:20px;color:var(--mut);cursor:pointer;white-space:nowrap}
.chstep:hover{border-color:var(--gold);color:var(--sugar)}
.chstep.on{border-color:var(--gold);background:var(--goldS);color:var(--gold);font-weight:650}
.chstep .st{font-family:'IBM Plex Mono';font-size:9px;color:var(--mut2)}
.chstep.on .st{color:var(--gold)}
.chsep{color:var(--mut2);padding:0 5px;font-size:12px}
/* v60 · tour de primeiro acesso */
.tourbg{position:fixed;inset:0;background:rgba(26,36,50,.55);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.tourcard{background:var(--ink);border-radius:16px;max-width:620px;width:100%;padding:26px 30px;box-shadow:0 18px 60px rgba(20,28,40,.35)}
.tourcard .tkick{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:600}
.tourcard h3{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:6px 0 10px}
.tourcard p{font-size:13.5px;color:var(--dim);line-height:1.65;margin-bottom:8px}
.tourdots{display:flex;gap:6px;margin:14px 0 4px}
.tourdots i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.tourdots i.on{background:var(--gold)}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
/* v60 · página guia "Como usar" */
.gflow{display:flex;align-items:stretch;flex-wrap:wrap;margin:6px 0 4px}
.gstep{flex:1;min-width:148px;background:var(--ink);border:1px solid var(--line);border-radius:var(--rl);padding:13px 15px;cursor:pointer;position:relative;box-shadow:var(--sh)}
.gstep:hover{border-color:var(--gold)}
.gstep .gn{font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:var(--gold)}
.gstep b{display:block;font-family:'Fraunces',serif;font-size:15px;margin:3px 0 4px}
.gstep small{display:block;font-size:11px;color:var(--mut);line-height:1.5}
.garr{display:flex;align-items:center;padding:0 7px;color:var(--gold);font-size:16px}
</style>
</head>
<body>
<!-- ═══ CHANGELOG v60 · ARQUITETURA UX/UI — navegação por FLUXO DE TRABALHO + guia de uso + dashboards de boletas & mandatos + relações explícitas:
 (1) SIDEBAR reorganizada na ordem do processo: Visão geral → Como usar → 1·Configurar (Setup · Política · Produção) → 2·Autorizar (Mandatos) → 3·Operar (Boletas hedge · Em aberto · Contratos · Frete · Fila de aprovação) → 4·Acompanhar (Visualizações · Mercado);
 (2) TOUR DE PRIMEIRO ACESSO: overlay em 5 passos explicando o fluxo configurar→autorizar→operar→acompanhar; reabrível pelo botão "?" no topo e pelo link do guia;
 (3) PÁGINA "COMO USAR" (V.guia): fluxo em 7 passos clicáveis, as 5 relações-chave (política→mandato, mandato→boleta, contrato→cronograma→boleta, boleta→aprovação→confirmation, produção→disponível→enquadramento), checklist de primeiro uso e vocabulário;
 (4) TRILHA DO FLUXO (chainHtml) no topo de todas as telas do processo com o passo atual destacado — as relações entre entidades ficam visíveis em qualquer tela, com navegação de 1 clique;
 (5) VISUALIZAÇÕES ganham 2 dashboards novos (VIS-06 Boletas · status — por tipo, ciclo aprovação/confirmation, linha a linha com vínculos; VIS-07 Mandatos · consumo — % consumido do autorizado por mandato, dentro/FORA, boletas vinculadas);
 Motor, seeds e demais telas preservados da v59. ═══ -->
<!-- ═══ CHANGELOG v59 · COCKPIT EXECUTIVO — integração das críticas VÁLIDAS da revisão externa (recorte aprovado):
 (1) BANNER-SEMÁFORO de 1 linha no topo (acima do funil, preservando a ordem da v57): "Safra em CRÍTICO/ATENÇÃO/REGULAR · n crítico · n alertas · principal exposição · MTM" — o semáforo do mockup aprovado, comprimido;
 (2) RENOMES dos 4 cards: Cobertura da safra (não "venda física" — o card mede fixação sobre o disponível) · Preço médio fixado · Proteção cambial · Margem / Caixa;
 (3) GAP TEXTUAL nos cards: "↓ X p.p. abaixo do mínimo Y%" em destaque — o gauge vira confirmação visual; o sub detalhado migrou para tooltip (dieta de microtexto);
 (4) RUPTURA CALCULADA: a legenda didática do funil virou conclusão automática — "Principal ruptura da cadeia: X t contratadas sem preço (n% do físico)" + próxima ruptura;
 (5) DEFASAGEM POSIÇÃO × MERCADO como exceção: chip "⚠ defasagem N dias" no cabeçalho quando posição e mercado têm datas diferentes;
 (6) FUNIL com % + denominador promovidos a linha principal (sub descritivo menor);
 (7) HORIZONTE gap-first: nova coluna GAP (físico ou preço, o dominante) e HISTÓRICO RECOLHIDO (meses passados colapsados em uma linha expansível, fora da marcação de pior mês — que agora considera só o futuro);
 (8) MTM hierárquico: card maior que pendências/enquadramento/físico;
 (9) EXCEÇÕES em lista compacta 2 colunas (severidade · motivo · objeto · ação), sem cards com espaço vazio;
 (10) MANDATOS: "% consumido do autorizado" explícito na barra.
 REJEITADAS (com justificativa em ata): renome "Venda física" (tecnicamente incorreto) · gap mensal contra banda da política (banda é por safra — rateio mensal é decisão de política, não de UI) · rebaixar o funil na ordem (contraria decisão do PO na v57) · reforma de cores global (vai como projeto próprio "gramática de cores", junto com sidebar por persona). ═══ -->

function hMTM(h){
 if(h.tipo==='fixacao'){const mkt=MKT.ny[h.venc]; if(mkt==null||!h.lotes)return null;
  const notLb=h.lotes*LOTE_LB;
  const dUS=(h.dir==='venda'?(h.px-mkt):(mkt-h.px))/100*notLb;   /* vendido ganha se mercado cai */
  return {us:dUS,br:dUS*MKT.fx};}
 if(h.tipo==='ndf'){const fwd=MKT.fxFwd[h.venc]||MKT.fx;
  const dBR=(h.dir==='venda'?(h.px-fwd):(fwd-h.px))*(h.notUS||0);
  return {us:dBR/MKT.fx,br:dBR};}
 if(h.tipo==='opcao'){const mkt=MKT.ny[h.venc]; if(mkt==null||!h.lotes)return null;
  const intr=Math.max(0,h.opTipo==='put'?(h.strike-mkt):(mkt-h.strike))/100*h.lotes*LOTE_LB;
  const premUS=(h.premio||0)/100*h.lotes*LOTE_LB;
  const dUS=h.dir==='compra'?(intr-premUS):(premUS-intr);
  return {us:dUS,br:dUS*(h.spot||MKT.fx),intr,premUS};}
 return null;

 const dt=new Date(+p[2],+p[1]-1,+p[0]);dt.setDate(dt.getDate()+1);
 while(dt.getDay()===0||dt.getDay()===6)dt.setDate(dt.getDate()+1);
 return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();}

function dDias(a,b){const pa=String(a).split('/'),pb=String(b).split('/');
 if(pa.length<3||pb.length<3)return 0;
 return Math.round((new Date(+pb[2],+pb[1]-1,+pb[0])-new Date(+pa[2],+pa[1]-1,+pa[0]))/864e5);}
const CONF_PRAZO=2; /* dias úteis (aprox.) para o confirmation chegar */
function confSt(h){
 if(h.confSt==='recusado')return{k:'recusado',t:'recusado · irregular',c:'r'};

function distPrev(n,forma,peso,cresce){if(!(n>0))return[];const w=[];
 for(let i=0;i<n;i++)w.push(forma==='exponencial'?Math.pow(Math.max(+peso||1.5,1.01),cresce?i:n-1-i):1);
 const t=w.reduce((a,b)=>a+b,0);return w.map(x=>Math.round(x/t*100));}

 }

}
function mandCheck(m){
 const av=[];

 if(iguais.length) av.push({t:'r',m:iguais.length+' mandato(s) parecido(s) — mesma commodity/tela ('+iguais.map(x=>x.id).join(', ')+'). Alterar ou excluir o anterior?'});
 const tetoPol=Math.round(disponivel(m.tela?safraDe(m.tela):CIA.safraAtiva).lotes*POLITICA.tetoAbs/100); /* v54: teto = teto absoluto × disponível */
 const somaCom=MAND2.filter(x=>x.com===m.com&&x.qtdMax).reduce((a,x)=>a+(+x.qtdMax||0),0)+(+m.qtdMax||0);
 if(m.qtdMax&&somaCom>tetoPol) av.push({t:'r',m:'a soma dos mandatos ('+somaCom+' lotes) estoura o teto da política ('+tetoPol+') para esta commodity'});
 if(m.ctr) av.push({t:'a',m:'vinculado ao contrato '+m.ctr+(m.tranche?' · tranche '+m.tranche:'')+' — a exposição do mandato acompanha o contrato'});

 return av;
}

function salvarMandato(){
 if(MF.tipo!=='fixacao'&&!(+MF.qtd)){toastMsg('Informe a quantidade do mandato');return;}
 if(MF.tipo==='fixacao'&&!(+MF.qtd)&&!(+MF.precoIdeal)&&!(+MF.precoMin)&&!(+MF.precoMax)&&!MF.aMercado){toastMsg('Informe a quantidade ou um critério de preço (target/mín/máx)');return;}
 if(MF.tipo==='moeda'&&!MF.aMercado&&!(+MF.precoIdeal)&&!(+MF.precoMin)&&!(+MF.precoMax)){toastMsg('Informe a taxa target, mínima ou máxima (ou marque "a mercado")');return;}
 if(polAuto(MF).pol==='fora'&&!MF.aprovador){toastMsg('Mandato FORA da política exige um aprovador');return;} /*F-01*/
 const id='MD-'+String(MAND2.length+1).padStart(2,'0');
 const cad=[];if(MF.cadT)cad.push('Δt '+MF.cadTforma+'/'+MF.cadTfreq);if(MF.cadP)cad.push('Δpreço '+MF.cadPforma+' (passo '+MF.cadPpasso+')');

 const rotaF=MF.rota==='__outra__'?(MF.rotaLivre||'—'):MF.rota;
 const QU=MF.qtdUn||unsQtd(MF)[0];
 const descAuto=MF.tipo==='moeda'?('Travar '+moedaDe(MF.moedaPar).c+' '+(MF.qtd?n0(+MF.qtd):'—')+(MF.aMercado?' a mercado':MF.precoIdeal?' @ target '+MF.precoIdeal+' '+unPreco(MF):MF.precoMin?' · mín '+MF.precoMin+' '+unPreco(MF):MF.precoMax?' · máx '+MF.precoMax+' '+unPreco(MF):'')+(MF.vencMoeda?' · venc '+MF.vencMoeda:''))
  :MF.tipo==='comercial'?('Operação comercial de '+(MF.qtd||'—')+' t de '+comN)
  :MF.tipo==='logistica'?('Logística '+(rotaF||'—')+' · '+(MF.qtd||'—')+' t'+(MF.tarifa?' @ '+MF.tarifa+' R$/t':''))
  :(MF.qtd?('Precificar '+MF.qtd+' '+QU+' de '+comN+' via '+MF.instr+(MF.tela?' · tela '+MF.tela:'')+(MF.aMercado?' · a mercado':MF.precoIdeal?' · target '+MF.precoIdeal+' '+unPreco(MF):''))
   :('Manter preço de '+comN+(MF.precoMin?' ≥ '+MF.precoMin+' '+unPreco(MF):'')+(MF.precoIdeal?' · target '+MF.precoIdeal+' '+unPreco(MF):'')+(MF.precoMax?' · máx '+MF.precoMax+' '+unPreco(MF):'')+(MF.tela?' · tela '+MF.tela:'')));
 MAND2.push({id,desc:descAuto,ent:MF.ent,com:MF.com,tela:MF.tela||'',
  criterio:(MF.aMercado?'a mercado':'target '+(MF.precoIdeal||'—')+' '+unPreco(MF)+(MF.precoMin?' · mín '+MF.precoMin:'')+(MF.precoMax?' · máx '+MF.precoMax:''))
   +(MF.qtd?' · '+MF.qtd+' '+QU:' · sem teto de volume (ordem de preço)')+(cad.length?' · '+cad.join(MF.combo==='e'?' → ':' + '):''),
  lotes:QU==='lotes'?(+MF.qtd||null):null,qtd:+MF.qtd||null,qtdUn:QU,alvo:MF.aMercado?'a mercado':('target '+(MF.precoIdeal||'—')+' '+unPreco(MF)),
  pol:polAuto(MF).pol,polMot:polAuto(MF).mot,polId:MF.polId||polPadraoDe(MF.ent),tipo:MF.tipo,rota:rotaF||null,prodMes:MF.prodMes||null,moedaPar:MF.tipo==='moeda'?MF.moedaPar:null,moedaSimb:MF.tipo==='moeda'?moedaDe(MF.moedaPar).s:null,vencMoeda:MF.vencMoeda||null,tarifa:+MF.tarifa||null,criado:HOJE,instr:MF.instr,moeda:MF.moeda||null,ctr:MF.ctr||null,tranche:(MF.tranche||'').trim()||null,
  precoMin:+MF.precoMin||null,precoMax:+MF.precoMax||null,precoIdeal:+MF.precoIdeal||null,qtdMin:null,qtdMax:+MF.qtd||null,
  jan:(MF.janIni||MF.janFim)?{ini:MF.janIni||'—',fim:MF.janFim||'—'}:null,
  cadT:MF.cadT?{freq:MF.cadTfreq,forma:MF.cadTforma}:null,cadP:MF.cadP?{passo:MF.cadPpasso,forma:MF.cadPforma}:null,combo:MF.combo,carry:MF.carry,
  st:(polAuto(MF).pol==='fora'||!podeEmitir())?'pendente_aprovacao':'ativo',aprovador:MF.aprovador||(polAuto(MF).pol==='fora'?null:'Gestor — Gustavo'),por:usrAtual().n,

 MF=null;go('mandato',id);
 toastMsg(id+(MAND2[MAND2.length-1].st==='pendente_aprovacao'?' — enviado para aprovação':' emitido direto'));

function mandatoTexto(){
 const comN=COMBOLSA[MF.com]?COMBOLSA[MF.com].n:MF.com;
 const QU=MF.qtdUn||unsQtd(MF)[0];
 return 'MANDATO — '+({fixacao:'precificação da commodity',moeda:'moeda',comercial:'operação comercial',logistica:'operação logística'}[MF.tipo]||MF.tipo)+'\n'
  +(MF.tipo==='fixacao'||MF.tipo==='comercial'?'Commodity: '+comN+(MF.tela?' · tela '+MF.tela:'')+'\n':'')
  +(MF.tipo==='moeda'?'Par: '+MF.moedaPar+' contra o real\n':'')+(MF.tipo==='moeda'&&MF.vencMoeda?'Vencimento: '+MF.vencMoeda+'\n':'')
  +(MF.tipo==='logistica'&&MF.rota?'Rota: '+(MF.rota==='__outra__'?MF.rotaLivre:MF.rota)+'\n':'')
  +'Quantidade: '+(MF.qtd||'—')+' '+QU+'\n'
  +(MF.aMercado?'Preço: a mercado':'Target: '+(MF.precoIdeal||'—')+' '+unPreco(MF)+(MF.precoMin?' · mín '+MF.precoMin:'')+(MF.precoMax?' · máx '+MF.precoMax:''))+'\n'
  +(MF.janIni||MF.janFim?'Janela: '+(MF.janIni||'—')+' → '+(MF.janFim||'—')+'\n':'')
  +(MF.ctr?'Contrato: '+MF.ctr+(MF.tranche?' · '+MF.tranche:'')+'\n':'')
  +'Política: '+(polAuto(MF).pol==='fora'?'FORA — alçada específica':'dentro')+' · '+HOJE;

function copiarMandato(){const t=mandatoTexto();

function ctCalc(){
 const el=document.getElementById('ctImp'); if(!el)return;
 const q=+CF.qtd||0;
 const eq=document.getElementById('ctQ'); if(eq)eq.textContent=q?('≈ '+n0(q/LOTE_T)+' lotes NY11'):'';
 let msg='';
 if(CF.tipoPx==='a fixar'){
  const lot=CF.cron.reduce((a,l)=>a+(+l.lotes||0),0);
  const nec=q?Math.round(q/LOTE_T):0;
  const lt=document.getElementById('ctLotes');
  if(lt)lt.textContent=lot?`cronograma soma ${lot} lotes · a quantidade pede ≈ ${nec}`:'';
  msg=q&&lot?(Math.abs(lot-nec)<=3?'<div class="ok">Cronograma cobre a quantidade ('+lot+' ≈ '+nec+' lotes).</div>':'<div class="warn">Cronograma soma '+lot+' lotes, mas a quantidade pede ≈ '+nec+'.</div>'):'';
 }
 const comps=[];
 if(CF.temBasis&&CF.basisVal!=='')comps.push('basis '+sg(+CF.basisVal)+n2(Math.abs(+CF.basisVal))+(CF.com==='soja'||CF.com==='milho'?' US$/saca':' c/lb'));
 if(CF.temFrete&&CF.freteVal!=='')comps.push('frete '+n2(+CF.freteVal)+' R$/t');
 if(CF.temElev&&CF.elevVal!=='')comps.push('elevação '+n2(+CF.elevVal)+' US$/t');
 if(CF.temWash)comps.push('washout previsto');
 el.innerHTML=`<div class="delta"><span class="k">Quantidade</span><span class="v">${q?fT(q):'—'}</span></div>
  <div class="delta"><span class="k">Moeda / exposição</span><span class="v">${CF.moeda==='USD'?'USD → gera exposição cambial':'BRL'}</span></div>
  ${comps.length?`<div class="delta"><span class="k">Componentes</span><span class="v">${comps.join(' · ')}</span></div>`:''}${msg}`;
}
let CSEQ=0;
function salvarContrato(){
 const q=+CF.qtd||0; if(!q){toastMsg('Informe a quantidade');return;}
 if(CF.tipoPx==='preço fixo'&&!(+CF.px)){toastMsg('Informe o preço');return;}
 const id='CTR-N'+String(++CSEQ).padStart(3,'0');
 CONTR.push({id,ext:CF.ext||id,dir:CF.dir,cpart:CF.cpart,com:CF.com,sub:CF.sub,safra:CF.safra,data:HOJE,
  qtd:q,un:'t',tol:+CF.tol||0,inco:CF.inco,local:CF.local,locais:CF.locais.filter(l=>l.local.trim()).map(l=>({local:l.local,obs:l.obs||'—'})),mand:CF.mand||null,
  anexo:CF.anexoNome?{nome:CF.anexoNome,tam:CF.anexoTam||'—',data:HOJE,por:usrAtual().n}:null,
  qual:CF.com.startsWith('acucar')?{polMin:99,polMax:99.49,cinzas:.15,umid:.15,cor:1200,nonGmo:true}:{umid:14,imp:1,avar:5,quebr:3},
  precific:CF.tipoPx==='preço fixo'?{tipo:'preço fixo',px:+CF.px,pxu:(CF.com==='soja'||CF.com==='milho')?'US$/saca 60kg':'US$/t',moeda:'USD'}
   :{tipo:'a fixar',mec:'EFP/AA · SEO',conv:LB_T,basePol:96,moeda:CF.moeda,
     cron:CF.cron.filter(l=>+l.lotes).map(l=>({venc:l.venc,lotes:+l.lotes,prem:+l.prem,entrega:l.entrega||'—'}))},
  entregas:[{mes:'cronograma a detalhar',t:q}],
  comp:(CF.temBasis||CF.temWash||CF.temFrete||CF.temElev)?{
   basis:CF.temBasis?{val:+CF.basisVal||0,ref:CF.basisRef||'—'}:null,

const VMES={F:1,G:2,H:3,J:4,K:5,M:6,N:7,Q:8,U:9,V:10,X:11,Z:12};
function vencData(v){ /* código de tela (K26) ou mês (fev/27) → Date */
 if(!v)return null;const m1=String(v).match(/^([FGHJKMNQUVXZ])(\d{2})$/);if(m1)return new Date(2000+ +m1[2],VMES[m1[1]]-1,1);
 const m2=String(v).match(/^([a-z]{3})\/(\d{2})$/);if(m2&&MESN[m2[1]])return new Date(2000+ +m2[2],MESN[m2[1]]-1,1);return null;}
function mesesAte(v){const d=vencData(v);if(!d)return null;const [dd,mm,aa]=HOJE.split('/');const h=new Date(+aa,+mm-1,1);return (d.getFullYear()-h.getFullYear())*12+(d.getMonth()-h.getMonth());}
function safraDe(v){const d=vencData(v);if(!d)return CIA.safraAtiva;const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return String(y).slice(2)+'/'+String(y+1).slice(2);}

/* ENQ-01 · disponível = produção estimada − reserva de contingência escalonada por prazo (§11.1) */
function disponivel(sf){sf=sf||CIA.safraAtiva;let prod=0,cont=0;
 mesesSafra(sf).forEach(m=>{const r=(PROD[sf]&&PROD[sf].sucro[m])||{};const t=r.acucar||0;if(!t)return;prod+=t;
  const k=mesesAte(m);const p=(r.st==='real')?0:contPct(Math.max(0,k||0));cont+=t*p/100;});
 if(!prod&&sf!==CIA.safraAtiva){prod=capDe('acucar_vhp')*(CIA.mixGuidance/48);cont=prod*contPct(sf===SAFRAS[1]?18:30)/100;} /* sem guidance carregado: capacidade como proxy */
 return{prod,cont,disp:prod-cont,lotes:(prod-cont)/LOTE_T};}
/* ENQ-02 · cobertura por horizonte: futuros pelo nocional · opções pelo delta-eq. (0,5 est.) · contratos a preço fixo contam (§7.3/§8) */
function coberturaSafra(sf,extraLotes){sf=sf||CIA.safraAtiva;
 const hs=HEDGE.filter(h=>h.aprovSt!=='pendente_aprovacao'&&h.aprovSt!=='rejeitada'&&(h.tipo==='fixacao'||h.tipo==='opcao')&&safraDe(h.venc)===sf);
 const lot=hs.reduce((a,h)=>a+(h.lotes||0)*(h.tipo==='opcao'?0.5:1),0)+(extraLotes||0);
 const fixoT=CONTR.filter(c=>c.st==='ativo'&&c.com.startsWith('acucar')&&c.safra===sf&&c.precific.tipo==='preço fixo').reduce((a,c)=>a+c.qtd,0);
 const D=disponivel(sf);const t=lot*LOTE_T+fixoT;const b=POLITICA.bandas.find(x=>x.sf===sf)||POLITICA.bandas[0];
 const pct=D.disp?t/D.disp*100:0;return{sf,t,lotes:lot,fixoT,disp:D.disp,prod:D.prod,cont:D.cont,pct,min:b.min,max:b.max,h:b.h,st:pct<b.min?'abaixo':pct>b.max?'acima':'dentro'};}
/* ENQ-03 · preço: média fixada × gatilho (custo caixa) × piso econômico (§9) e percentil da referência */
function precoEnq(){const fx=HEDGE.filter(h=>h.tipo==='fixacao'&&h.aprovSt!=='rejeitada');
 const lot=fx.reduce((a,h)=>a+(h.lotes||0),0);const med=lot?fx.reduce((a,h)=>a+(h.px||0)*(h.lotes||0),0)/lot:null;
 const prem=HEDGE.filter(h=>h.tipo==='opcao').reduce((a,h)=>a+(h.dir==='compra'?1:-1)*(h.premio||0)*(h.lotes||0),0);
 const liq=lot?med-prem/lot:med; /* preço médio efetivo líquido de prêmios (§12) */
 const vs=VENCS.slice(0,5);const pctl=vs.reduce((a,v)=>a+(MKTX.pctl[v]||0),0)/vs.length;
 const mkt=MKT.ny['V26'];const g=CIA.orc.custoCaixa,p=CIA.orc.pisoEcon;
 const stM=mkt<p?'abaixo':mkt<g?'atenção':'dentro';
 return{med,liq,lot,pctl,mkt,gat:g,piso:p,eq:CIA.orc.pxEq,st:med==null?stM:(med<p?'abaixo':med<g?'atenção':'dentro'),stM,
  quente:pctl>=POLITICA.fixacao.quente,frio:pctl<=POLITICA.fixacao.frio};}
/* ENQ-04 · câmbio: NDF ÷ receita fixada (banda §6.2) · NDF além da receita fixada ÷ receita não fixada (teto) · exposição líquida (§5.3) */
function cambioEnq(extraUS){const E=expoEnt();const fx=HEDGE.filter(h=>h.tipo==='fixacao'&&h.aprovSt!=='rejeitada');
 const recFix=fx.reduce((a,h)=>a+(h.lotes||0)*LOTE_LB*(h.px||0)/100,0);
 const ndf=HEDGE.filter(h=>h.tipo==='ndf'&&h.aprovSt!=='rejeitada'&&h.aprovSt!=='pendente_aprovacao').reduce((a,h)=>a+(h.notUS||0),0)+(extraUS||0);
 const D=disponivel();const recNaoFix=Math.max(0,(D.disp-fx.reduce((a,h)=>a+(h.lotes||0)*LOTE_T,0))*LB_T*(MKT.ny['V26']||0)/100);
 const pct=recFix?ndf/recFix*100:0;const exced=Math.max(0,ndf-recFix);const pctNao=recNaoFix?exced/recNaoFix*100:0;
 const liqUS=recFix-ndf-CIA.fin.divUSD*0; /* dívida em US$ conta como hedge natural (Anexo A) — exibida separada */
 return{recFix,ndf,pct,min:POLITICA.fx.fixMin,max:POLITICA.fx.fixMax,exced,recNaoFix,pctNao,naoMax:POLITICA.fx.naoFixMax,descob:Math.max(0,recFix-ndf),divUSD:CIA.fin.divUSD,
  st:pct<POLITICA.fx.fixMin?'abaixo':pct>POLITICA.fx.fixMax?'acima':pctNao>POLITICA.fx.naoFixMax?'acima':'dentro'};}
/* ENQ-05 · fluxo de caixa & liquidez: margem em corretoras ≤ 10% do caixa (§6.4) · estresse 3σ/10du × liquidez · alavancagem & liquidez mínima (§12) */
function caixaEnq(){const fut=HEDGE.filter(h=>h.tipo==='fixacao'&&h.instr.indexOf('ICE')>=0&&h.aprovSt!=='rejeitada');
 const lot=fut.reduce((a,h)=>a+(h.lotes||0),0);const mtm=fut.reduce((a,h)=>a+((hMTM(h)||{}).br||0),0);
 const margIni=lot*1100*MKT.fx; /* US$ 1.100/lote est. */const margem=margIni+Math.max(0,-mtm);
 const pct=CIA.fin.caixa?margem/CIA.fin.caixa*100:0;
 const noc=fut.reduce((a,h)=>a+(h.lotes||0)*LOTE_LB*(h.px||0)/100,0)*MKT.fx;

  st:pct>POLITICA.margemCaixa||stress>liqTot?'acima':alav>POLITICA.targets.alavMax||liqM<POLITICA.targets.liqMeses?'atenção':'dentro',suspende:stress>liqTot};}
/* ENQ-06 · contrapartes: concentração ≤ 50% físico · ≤ 20% financeiro OTC (§6.5) · homologação · limite por contraparte */
function cpEnq(){const fis={};CONTR.filter(c=>c.st==='ativo').forEach(c=>fis[c.cpart]=(fis[c.cpart]||0)+c.qtd);
 const fin={};HEDGE.filter(h=>h.aprovSt!=='rejeitada'&&(h.tipo==='ndf'||h.tipo==='opcao'||(h.instr||'').indexOf('ICE')<0)).forEach(h=>{const n=h.tipo==='ndf'?(h.notUS||0):(h.lotes||0)*LOTE_LB*(h.px||h.strike||0)/100;fin[h.cpart]=(fin[h.cpart]||0)+n;});
 const tF=Object.values(fis).reduce((a,b)=>a+b,0),tN=Object.values(fin).reduce((a,b)=>a+b,0);

 rows.forEach(r=>{r.st=r.pct>r.max||(r.lim&&r.v>r.lim)||!cp(r.id).homol?'acima':'dentro';});

/* ENQ-11 · régua de banda: faixa mín–máx sombreada + marcador do valor atual (cor só semântica) */
function regua(val,min,max,esc,piso){esc=esc||100;const X=v=>Math.max(0,Math.min(100,v/esc*100));
 const cor=ENQCOR[(min!=null&&val<min)||(max!=null&&val>max)?'acima':'dentro']==='g'?'var(--cane)':'var(--clay)';
 return `<div style="position:relative;height:14px;margin-top:10px;background:var(--ink3);border-radius:7px">
  ${min!=null||max!=null?`<div style="position:absolute;left:${X(min||0)}%;width:${X(max!=null?max:esc)-X(min||0)}%;top:0;bottom:0;background:var(--caneS);border-left:1px solid var(--cane);border-right:1px solid var(--cane)"></div>`:''}
  ${piso!=null?`<div style="position:absolute;left:${X(piso)}%;top:-2px;bottom:-2px;border-left:1.5px dashed var(--clay)" title="piso econômico"></div>`:''}
  <div style="position:absolute;left:calc(${X(val||0)}% - 5px);top:-3px;width:10px;height:20px;border-radius:3px;background:${cor};border:2px solid #fff;box-shadow:0 0 0 1px ${cor}"></div></div>
  <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut2);margin-top:3px;font-family:'IBM Plex Mono'"><span>0</span>${min!=null?`<span>mín ${min}</span>`:'<span></span>'}${max!=null?`<span>máx ${max}</span>`:'<span></span>'}<span>${esc}</span></div>`;}
/* ENQ-12 · enquadramento de UMA boleta (existente ou em edição) contra os critérios da política */
function bolEnq(h){const R=[];const ok=(t,m)=>R.push({s:'ok',t,m}),at=(t,m)=>R.push({s:'at',t,m}),fora=(t,m)=>R.push({s:'fora',t,m});
 const instr=(h.instr||'').toLowerCase();
 if(h.tipo==='opcao'&&h.dir==='venda'){const D=disponivel();const pct=(h.lotes||0)*LOTE_T/(D.disp||1)*100;if(pct>POLITICA.vendaCoberta)fora('Instrumento','venda de opção acima do teto de '+POLITICA.vendaCoberta+'% do disponível — vedado (§8)');else at('Instrumento','venda coberta de opção — exige aprovação do Comitê (§8)');}
 else if(/acumul|barreira|exót/.test(instr))fora('Instrumento','estrutura exótica — vedada (§8)');else ok('Instrumento',(h.instr||'—')+' permitido (§8)');
 const c=cp(h.cpart);if(c&&c.homol===false)fora('Contraparte',c.nome+' não homologada (§5.5)');else ok('Contraparte',(c.nome||'—').split(' ')[0]+' homologada');
 const k=mesesAte(h.venc);if(k!=null&&k>POLITICA.horizonteAnos*12)fora('Horizonte',h.venc+' está a '+k+' meses — além de '+POLITICA.horizonteAnos+' anos (§7.1)');else if(k!=null)ok('Horizonte',h.venc+' · '+k+' meses · dentro de '+POLITICA.horizonteAnos+' anos');
 const md=h.mand?getMd(h.mand):null;if(!h.mand)fora('Mandato','sem direcionamento aprovado — operação sem mandato (§13/§14)');else if(md&&md.pol==='fora')at('Mandato',md.id+' é FORA da política (aprovado por '+(md.aprovador||'—')+')');else if(md&&md.st==='pendente_aprovacao')at('Mandato',md.id+' ainda pendente');else ok('Mandato',(md?md.id:h.mand)+' dentro da política');
 if(h.tipo==='fixacao'&&h.dir==='venda'&&+h.px>0){const px=pxToClb(h.px,h.pxu,h.spot);if(px!=null){if(px<CIA.orc.pisoEcon)fora('Preço',n2(px)+' ¢/lb abaixo do piso econômico '+n2(CIA.orc.pisoEcon)+' — exige deliberação do Comitê (§9)');else if(px<CIA.orc.custoCaixa)at('Preço',n2(px)+' ¢/lb abaixo do gatilho (custo caixa '+n2(CIA.orc.custoCaixa)+')');else ok('Preço',n2(px)+' ¢/lb acima do gatilho '+n2(CIA.orc.custoCaixa)+' (§9)');}}
 if(h.tipo==='fixacao'||h.tipo==='opcao'){const sf=safraDe(h.venc);const novo=h.id?0:(h.lotes||0)*(h.tipo==='opcao'?0.5:1);const cv=coberturaSafra(sf,novo);
  if(cv.pct>cv.max)fora('Cobertura',sf+' ficaria em '+n1(cv.pct)+'% — acima do máximo de '+cv.max+'% (over-hedge · §6.3)');else ok('Cobertura',sf+' em '+n1(cv.pct)+'% · banda '+cv.min+'–'+cv.max+'%');}
 if(h.tipo==='ndf'){const f=cambioEnq(h.id?0:(h.notUS||0));if(f.pct>f.max)fora('Câmbio','cobertura da receita fixada iria a '+n1(f.pct)+'% — acima de '+f.max+'% (§6.2)');else if(f.pctNao>f.naoMax)fora('Câmbio','proteção antecipada '+n1(f.pctNao)+'% da receita não fixada — teto '+f.naoMax+'%');else ok('Câmbio','receita fixada coberta em '+n1(f.pct)+'% · banda '+f.min+'–'+f.max+'%');}
 if(h.tipo==='fixacao'&&(h.instr||'').indexOf('ICE')>=0){const kx=caixaEnq();if(kx.suspende)fora('Liquidez','estresse de margem excede a liquidez — novas posições com ajuste diário suspensas (§6.4)');else if(kx.pct>kx.max)at('Liquidez','margem em corretoras '+n1(kx.pct)+'% do caixa — acima do teto '+kx.max+'%');}
 if(h.tdate&&h.dtEmis&&dDias(h.tdate,h.dtEmis)>POLITICA.controles.regD)at('Registro','emitida '+dDias(h.tdate,h.dtEmis)+' dia(s) após o trade — exige D+0 (§13)');
 if(h.id){const cs=confSt(h);if(cs.k==='atrasado')at('Confirmation','pendente além de '+POLITICA.controles.confDU+' d.u. — pendência formal (§13)');else if(cs.k==='divergente'||cs.k==='recusado')at('Confirmation',cs.t);}
 if(h.vinculo_a_posteriori)at('Vínculo','mandato vinculado a posteriori — desvio documentado');
 const g=R.some(r=>r.s==='fora')?'fora':R.some(r=>r.s==='at')?'atenção':'dentro';return{R,g};}
const bolChip=h=>{const e=bolEnq(h);return `<span class="chip ${e.g==='fora'?'r':e.g==='atenção'?'a':'g'}" title="${e.R.filter(r=>r.s!=='ok').map(r=>r.t+': '+r.m).join(' · ')||'dentro da política'}">${e.g==='fora'?'FORA':e.g==='atenção'?'atenção':'dentro'}</span>`;};
function bolEnqHtml(h){const e=bolEnq(h);return `<div class="delta"><span class="k">Política ${POLITICA.versao}</span><span class="v">${bolChip(h)}</span></div>
 ${e.R.map(r=>`<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px"><span class="${r.s==='fora'?'neg':r.s==='at'?'':'pos'}" style="width:12px">${r.s==='fora'?'✕':r.s==='at'?'!':'✓'}</span><span style="color:var(--mut);width:88px;flex:none">${r.t}</span><span>${r.m}</span></div>`).join('')}`;}
function hfPseudo(){const isN=HF.instr==='ndf',isO=HF.instr==='opcao';const lotes=toLotes(HF.qtd,HF.un);
 return{tipo:isN?'ndf':isO?'opcao':'fixacao',instr:isN?'NDF':isO?'opção · '+HF.opTipo+' '+(HF.dir==='compra'?'comprada':'vendida'):'futuro ICE',cpart:HF.cpart,dir:HF.dir,venc:HF.venc,lotes,notUS:+HF.notUS||0,px:isO?+HF.strike:+HF.px,pxu:isO?'c/lb USD':HF.pxu,spot:+HF.spot||MKT.fx,strike:+HF.strike,premio:+HF.premio,opTipo:HF.opTipo,mand:HF.mand&&HF.mand!=='__novo__'?HF.mand:'',tdate:HF.dtEmis,dtEmis:HF.dtEmis};}

function prodObj(){return PPERF==='graos'?PROD[PSAF].graos[PCULT]:PROD[PSAF][PPERF];}
function prodSet(mes,campo,val){const o=prodObj();const cur=o[mes]||{};const v=nparse(val);
 if(v===''){delete cur[campo];}else{cur[campo]=v;}
 cur.org='manual';if(!cur.st)cur.st=mesPassado(mes)?'real':'est';if(campo.indexOf('acucar_')===0)somaTipos(cur);o[mes]=cur;draw();}
function csvModelo(){
 const campos=prodCampos();const meses=mesesSafra(PSAF);
 const ex={acucar:'46.000',acucar_vhp:'30.000',acucar_cristal:'10.000',acucar_branco:'4.000',acucar_organico:'2.000',anidro:'8.200',hidratado:'14.700',moagem:'400.000',atr:'129',mixProj:'48',
  colheita:'120.000',area:'2.400',prodt:'52',pctColh:'35',
  abateCab:'1.850',abateArr:'33.300',rebanho:'12.000',reposicao:'8.500',peso:'18',confin:'40'};
 const linhas=['mes;'+campos.map(c=>c[0]).join(';')]
  .concat(meses.map((m,i)=>m+';'+campos.map(c=>i===0?(ex[c[0]]||'0'):'').join(';')));
 const blob=new Blob(["﻿"+linhas.join("\r\n")],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='modelo_producao_'+PPERF+(PPERF==='graos'?'_'+PCULT:'')+'_'+PSAF.replace('/','-')+'.csv';
 document.body.appendChild(a);a.click();a.remove();
 toastMsg('Modelo CSV do perfil '+PERFNOME[PPERF]+' · safra '+PSAF+' baixado — preencha e importe');}
function csvRead(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>csvParse(e.target.result);r.readAsText(f);inp.value='';}
function csvParse(txt){const rows=String(txt).split(/\r?\n/).filter(x=>x.trim());
 if(rows.length<2){PCSV={rows:[],errs:['arquivo vazio ou sem linhas de dados']};draw();return;}
 const sep=rows[0].includes(';')?';':',';
 const hdr=rows[0].split(sep).map(x=>x.trim());const campos=prodCampos().map(c=>c[0]);
 const out=[],errs=[];
 hdr.slice(1).forEach(h=>{if(!campos.includes(h))errs.push('coluna "'+h+'" não existe no perfil '+PERFNOME[PPERF]+' — será ignorada');});
 rows.slice(1).forEach((ln,i)=>{const cs=ln.split(sep).map(x=>x.trim());const mes=cs[0];
  if(!mesesSafra(PSAF).includes(mes)){errs.push('linha '+(i+2)+': mês "'+mes+'" fora da safra '+PSAF);return;}
  const rec={mes};let okAny=false;
  hdr.slice(1).forEach((h,j)=>{if(!campos.includes(h))return;
   const v=nparse(cs[j+1]);if(v!==''&&!isNaN(v)){rec[h]=v;okAny=true;}});
  if(okAny)out.push(rec);
  else if(cs.slice(1).some(x=>x!==''))errs.push('linha '+(i+2)+': sem valores numéricos válidos');
  /* linha só com o mês (template em branco) é ignorada em silêncio */});
 PCSV={rows:out,errs};draw();}
function csvConfirm(){if(!PCSV||!PCSV.rows.length){PCSV=null;draw();return;}
 const o=prodObj();
 PCSV.rows.forEach(r=>{const cur=o[r.mes]||{};Object.keys(r).forEach(k=>{if(k!=='mes')cur[k]=r[k];});cur.org='csv';if(!cur.st)cur.st=mesPassado(r.mes)?'real':'est';if(Object.keys(r).some(k=>k.indexOf('acucar_')===0))somaTipos(cur);o[r.mes]=cur;});
 toastMsg(PCSV.rows.length+' mês(es) importado(s) via CSV — origem marcada');PCSV=null;draw();}
let EF={d:HOJE,prod:'',v:''};
/* v44 · PROD-09: detalhamento do açúcar por tipo (caso Jalles) */
let PTIPO=false; let ACTIPOS=['vhp','cristal'];
const TIPOSAC=[['vhp','VHP'],['cristal','Cristal'],['branco','Branco'],['organico','Orgânico']];
function togTipo(k){const i=ACTIPOS.indexOf(k);if(i>=0){if(ACTIPOS.length>1)ACTIPOS.splice(i,1);}else ACTIPOS.push(k);PCSV=null;ESTCSV=null;draw();}
function prodCampos(){const base=PRODCAMPOS[PPERF];
 if(PPERF==='sucro'&&PTIPO){const t=ACTIPOS.map(k=>['acucar_'+k,'Aç. '+TIPOSAC.find(x=>x[0]===k)[1],'t',1]);
  return t.concat([['acucar','Aç. total','t',0]]).concat(base.slice(1));}
 return base;}
function estProds(){if(PPERF==='sucro'&&PTIPO)return ACTIPOS.map(k=>['açúcar '+TIPOSAC.find(x=>x[0]===k)[1].toLowerCase(),'t']).concat([['etanol anidro','m³'],['etanol hidratado','m³']]);return ESTPROD[PPERF];}
function estKeys(){if(PPERF==='sucro'&&PTIPO)return ACTIPOS.map(k=>['acucar_'+k,'açúcar '+TIPOSAC.find(x=>x[0]===k)[1].toLowerCase(),'t']).concat([['anidro','etanol anidro','m³'],['hidratado','etanol hidratado','m³']]);return ESTKEYS[PPERF];}
function somaTipos(cur){let t=0,tem=false;TIPOSAC.forEach(x=>{if(cur['acucar_'+x[0]]!=null){t+=cur['acucar_'+x[0]];tem=true;}});if(tem)cur.acucar=t;}

const ESTKEYS={sucro:[['acucar','açúcar','t'],['anidro','etanol anidro','m³'],['hidratado','etanol hidratado','m³']],
 graos:[['soja','soja','sc 60kg'],['milho','milho','sc 60kg']],
 pec:[['boi_cab','boi gordo','cab'],['boi_arr','boi gordo','@']]};

function estCsvModelo(){
 const ks=estKeys();
 const linhas=['data;'+ks.map(k=>k[0]).join(';'),'26/08/2026;'+ks.map((k,i)=>i===0?'27.000':'').join(';'),'02/09/2026;'+ks.map(()=>'').join(';')];

 a.download='modelo_estoques_'+PPERF+'.csv';document.body.appendChild(a);a.click();a.remove();

function estCsvRead(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>estCsvParse(e.target.result);r.readAsText(f);inp.value='';}
function estCsvParse(txt){const rows=String(txt).replace(/^﻿/,'').split(/\r?\n/).filter(x=>x.trim());
 if(rows.length<2){ESTCSV={rows:[],errs:['arquivo vazio ou sem linhas de dados']};draw();return;}
 const sep=rows[0].includes(';')?';':',';
 const hdr=rows[0].split(sep).map(x=>x.trim());const ks=estKeys();const keys=ks.map(k=>k[0]);
 const out=[],errs=[];
 hdr.slice(1).forEach(h=>{if(!keys.includes(h))errs.push('coluna "'+h+'" não existe nos estoques do perfil '+PERFNOME[PPERF]+' — será ignorada');});
 rows.slice(1).forEach((ln,i)=>{const cs=ln.split(sep).map(x=>x.trim());const d=cs[0];
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(d)){if(cs.slice(1).some(x=>x!==''))errs.push('linha '+(i+2)+': data "'+d+'" inválida (use dd/mm/aaaa)');return;}
  let any=false;const rec={d};
  hdr.slice(1).forEach((h,j)=>{if(!keys.includes(h))return;const v=nparse(cs[j+1]);if(v!==''&&!isNaN(v)){rec[h]=v;any=true;}});
  if(any)out.push(rec);else if(cs.slice(1).some(x=>x!==''))errs.push('linha '+(i+2)+': sem valores numéricos válidos');});
 ESTCSV={rows:out,errs};draw();}
function estCsvConfirm(){if(!ESTCSV||!ESTCSV.rows.length){ESTCSV=null;draw();return;}
 const ks=estKeys();let n=0;
 ESTCSV.rows.forEach(r=>{ks.forEach(k=>{if(r[k[0]]!=null){ESTQ.unshift({d:r.d,perfil:PPERF,prod:k[1],v:r[k[0]],un:k[2],org:'csv'});n++;}});});
 ESTQ.sort((a,b)=>{const ka=(a.d||'').split('/').reverse().join(''),kb=(b.d||'').split('/').reverse().join('');return kb.localeCompare(ka);});
 toastMsg(n+' lançamento(s) de estoque importados via CSV');ESTCSV=null;draw();}
function estqAdd(){const opts=estProds();const sel=opts.find(o=>o[0]+' ('+o[1]+')'===EF.prod)||opts.find(o=>o[0]===EF.prod);
 if(!sel||EF.v===''||isNaN(+EF.v)){toastMsg('Produto e volume são obrigatórios no lançamento de estoque');return;}
 ESTQ.unshift({d:EF.d||HOJE,perfil:PPERF,prod:sel[0],v:+EF.v,un:sel[1],org:'manual'});
 EF={d:HOJE,prod:'',v:''};toastMsg('Nível de estoque lançado');draw();}

     return `<td class="mono">${v?nfmt(v):'—'}</td>`;}).join('');
    return `<tr><td class="mono"><b>${m}</b></td>${cels}<td class="mono"><b>${nfmt(tot)}</b></td></tr>`}).join('')}
   <tr style="background:var(--ink2);border-top:2px solid var(--gold)"><td><b>Total</b></td>${trKeys.map(k=>{const v=ctrs.filter(c=>c.cpart===k).reduce((a,c)=>a+(c.entregas||[]).filter(e=>mesesPipe.includes(e.mes)).reduce((x,e)=>x+e.t,0),0);return `<td class="mono"><b>${nfmt(v)}</b></td>`}).join('')}<td class="mono"><b>${nfmt(mesesPipe.reduce((a,m)=>a+ctrs.reduce((x,c)=>x+(c.entregas||[]).filter(e=>e.mes===m).reduce((y,e)=>y+e.t,0),0),0))}</b></td></tr>
   </tbody></table>`:'<div class="empty">Sem entregas mensais definidas na safra selecionada — contratos com entrega por período aparecem em Comercializado × produção.</div>'}
  </div>`;
 }else{
  let f={recFix:0,ndf:0,pct:0,descob:0,pctNao:0,naoMax:POLITICA.fx.naoFixMax,min:POLITICA.fx.fixMin,max:POLITICA.fx.fixMax,divUSD:CIA.fin.divUSD,st:'dentro'};
  try{f=cambioEnq();}catch(e){}
  const porVenc={};nds.forEach(h=>{const k=h.venc;porVenc[k]=porVenc[k]||{us:0,pxw:0,mtm:0,n:0};porVenc[k].us+=(h.notUS||0);porVenc[k].pxw+=(h.px||0)*(h.notUS||0);porVenc[k].mtm+=((hMTM(h)||{}).br||0);porVenc[k].n++;});
  const porCtr={};nds.forEach(h=>{const k=h.ctr||'— sem contrato';porCtr[k]=porCtr[k]||{us:0,n:0};porCtr[k].us+=(h.notUS||0);porCtr[k].n++;});
  const porTrx={};nds.forEach(h=>{const k=h.tranche||'— sem tranche';porTrx[k]=porTrx[k]||{us:0,n:0};porTrx[k].us+=(h.notUS||0);porTrx[k].n++;});
  corpo=`
  <div class="kpis">
   <div class="kpi"><label>Receita fixada (base)</label><b>${fUS(f.recFix)}</b><small>fixações de preço × ¢/lb — o que há para proteger</small></div>
   <div class="kpi"><label>Câmbio fixado (NDF)</label><b>${fUS(ndUS)}</b><small>${nds.length} NDF(s) na safra ${VSAF} · total geral ${fUS(f.ndf)}</small></div>
   <div class="kpi"><label>Cobertura da receita fixada</label><b class="${f.st==='dentro'?'pos':'neg'}">${n1(f.pct)}%</b><small>banda ${f.min}–${f.max}% (§6.2) · antecipada s/ não fixada ${n1(f.pctNao)}% (teto ${f.naoMax}%)</small></div>
   <div class="kpi" style="border-color:var(--clay);background:${f.descob>0?'var(--clayS)':'transparent'}"><label>⚠ EXPOSIÇÃO CAMBIAL DESCOBERTA</label><b class="${f.descob>0?'neg':'pos'}">${fUS(f.descob)}</b><small>receita fixada sem NDF — comprada em US$ · dívida US$ à parte: ${fUS(f.divUSD)} (hedge natural)</small></div>
  </div>
  <div style="margin:0 0 16px">${regua(f.pct,f.min,f.max,130)}</div>
  <div class="cols">
  <div class="sec1" style="margin-top:0"><div class="sh"><h3>Câmbio fixado por tela (vencimento)</h3><span class="meta">NDFs · grade mensal</span></div>
   <table><thead><tr><th>Venc.</th><th>Notional</th><th>Taxa média</th><th>MTM</th><th style="text-align:left">% do fixado</th></tr></thead><tbody>
   ${Object.keys(porVenc).length?Object.keys(porVenc).map(k=>{const x=porVenc[k];const tx=x.us?x.pxw/x.us:0;
    return `<tr><td class="mono"><b>${k}</b></td><td class="mono">${fUS(x.us)}</td><td class="mono">${n2(tx)}</td>
    <td class="mono ${x.mtm>=0?'pos':'neg'}">${sg(x.mtm)}${fBR(Math.abs(x.mtm))}</td>
    <td><div style="display:flex;align-items:center;gap:6px">${vb(ndUS?x.us/ndUS*100:0,'var(--cane)')}<span class="mono" style="font-size:10.5px;width:40px;text-align:right">${ndUS?n0(x.us/ndUS*100):0}%</span></div></td></tr>`}).join(''):'<tr><td colspan="5"><div class="empty">Sem NDFs na safra selecionada.</div></td></tr>'}
   </tbody></table></div>
  <div class="sec1" style="margin-top:0"><div class="sh"><h3>Por contrato & por tranche</h3><span class="meta">a que físico a proteção cambial está amarrada</span></div>
   <table><thead><tr><th>Contrato</th><th>NDFs</th><th>Notional</th></tr></thead><tbody>
   ${Object.keys(porCtr).map(k=>`<tr><td style="text-align:left">${k.indexOf('CTR')===0?`<span class="idl" onclick="go('contrato','${k}')">${k.replace('CTR-','')}</span>`:`<span class="mut">${k}</span>`}</td><td class="mono">${porCtr[k].n}</td><td class="mono">${fUS(porCtr[k].us)}</td></tr>`).join('')}
   </tbody></table>
   <div class="sh" style="margin-top:12px"><h3 style="font-size:12.5px">Por tranche</h3></div>
   <table><thead><tr><th>Tranche</th><th>NDFs</th><th>Notional</th></tr></thead><tbody>
   ${Object.keys(porTrx).map(k=>`<tr><td class="mono" style="text-align:left">${k}</td><td class="mono">${porTrx[k].n}</td><td class="mono">${fUS(porTrx[k].us)}</td></tr>`).join('')}
   </tbody></table>
   <div class="integ">Leitura: receita <b>fixada</b> em ¢/lb vira exposição <b>comprada em US$</b> até a NDF travar a taxa — o card vermelho é o que ainda falta proteger. NDF sem contrato/tranche cobre o book como um todo.</div></div>
  </div>`;
 }
 return `<div class="kick">Visualizações · VIS-01..07 — dashboards & tabelas calculados das boletas, contratos, mandatos e produção</div>
 <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px"><h2 class="page">Visualizações</h2>
  <div class="acts" style="margin:0;align-items:center"><span class="note"><b>Safra:</b></span>
   ${VSAFRAS().map(sf=>`<span class="btn ${VSAF===sf?'':'ghost'}" style="padding:5px 13px;font-size:12px" onclick="VSAF='${sf}';draw()">${sf}</span>`).join('')}</div></div>
 <div class="acts" style="border-bottom:1px solid var(--line2);padding-bottom:10px">${tabs.map(t=>`<span class="btn ${VTAB===t[0]?'':'ghost'}" style="padding:6px 12px;font-size:12px" onclick="VTAB='${t[0]}';draw()">${t[1]}</span>`).join('')}</div>
 ${corpo}`;
 }catch(e){return '<div class="empty">Visualização indisponível: '+(e&&e.message||e)+'</div>';}
};
/* ═════════ CONTRAPARTES ═════════ */
V.cparts=()=>`<div class="kick">Cadastros</div><h2 class="page">Contrapartes</h2>
 <div class="sec1" style="margin-top:0"><div class="sh"><h3>Entidade própria — reutilizada por todas as boletas</h3><span class="meta">CNPJ ou CPF · limites de crédito na fase 2</span></div>
 <table><thead><tr><th>Nome</th><th>Tipo</th><th>Documento</th><th>Local</th><th>Boletas</th></tr></thead><tbody>
 ${CPART.map(x=>{const n=CONTR.filter(c=>c.cpart===x.id).length+HEDGE.filter(h=>h.cpart===x.id).length+FRETE.filter(f=>f.cpart===x.id).length;
  return `<tr><td style="text-align:left"><b>${x.nome}</b></td><td>${x.tipo}</td><td class="mono">${x.doc}</td><td>${x.end}</td><td class="mono">${n||'—'}</td></tr>`}).join('')}
 </tbody></table></div>`;
draw();
</script>
