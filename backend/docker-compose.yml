services:
  postgres:
    image: postgres:17
    container_name: fix-postgres
    environment:
      POSTGRES_DB: fix
      POSTGRES_USER: fix
      POSTGRES_PASSWORD: fix
    ports:
      - "5432:5432"
    volumes:
      - fix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fix -d fix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fix-postgres-data:
