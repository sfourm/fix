# Publica as imagens e o chart no GHCR e faz o deploy no cluster k3s (EC2) via SSM Run Command.
# Pré-requisitos (terraform output github_variables): variáveis do repositório AWS_REGION, AWS_DEPLOY_ROLE_ARN e
# EC2_INSTANCE_ID. Sem EC2_INSTANCE_ID o workflow só publica os artefatos.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR (imagens e chart)
  id-token: write # OIDC → role da AWS, sem chaves de acesso

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Imagem ${{ matrix.component }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: core-service
            dockerfile: backend/core-service/Dockerfile
          - component: bff
            dockerfile: frontend/bff/Dockerfile
          - component: web
            dockerfile: frontend/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Nome do repositório em minúsculas (exigência do GHCR)
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Chart e deploy no k3s
    needs: images
    runs-on: ubuntu-latest
    env:
      CHART_VERSION: 0.1.${{ github.run_number }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Referência do chart
        run: echo "CHART_REF=oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts/fix" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.1
      - name: Publicar o chart no GHCR (OCI)
        run: |
          # Dashboards do Grafana: fonte única em observability/grafana/dashboards (local e cluster)
          mkdir -p infra/helm/fix/files/dashboards
          cp observability/grafana/dashboards/*.json infra/helm/fix/files/dashboards/
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package infra/helm/fix --version "$CHART_VERSION" --app-version "$IMAGE_TAG" --destination dist
          helm push "dist/fix-$CHART_VERSION.tgz" "${CHART_REF%/fix}"

      - name: Credenciais da AWS (OIDC)
        if: vars.EC2_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: helm upgrade no nó (SSM Run Command)
        if: vars.EC2_INSTANCE_ID != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          COMMAND="/usr/local/bin/fix-deploy $CHART_REF $CHART_VERSION $IMAGE_TAG"
          PARAMETERS="$(jq -nc --arg c "$COMMAND" '{commands: [$c], executionTimeout: ["1200"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "fix deploy ${IMAGE_TAG:0:12}" \
            --parameters "$PARAMETERS" \
            --query Command.CommandId --output text)"
          echo "SSM command: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 10
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            echo "status: $STATUS"
          done

          OUTPUT="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)"
          ERRORS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text)"
          echo "$OUTPUT"
          [ -z "$ERRORS" ] || [ "$ERRORS" = "None" ] || { echo "--- stderr"; echo "$ERRORS"; }

          {
            echo "### Deploy $STATUS"
            echo "- Chart: \`$CHART_REF:$CHART_VERSION\`"
            echo "- Imagens: \`$IMAGE_TAG\`"
            echo '```'
            echo "$OUTPUT" | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]

      - name: Deploy não configurado
        if: vars.EC2_INSTANCE_ID == ''
        run: echo "::notice::Artefatos publicados. Configure AWS_REGION, AWS_DEPLOY_ROLE_ARN e EC2_INSTANCE_ID (terraform output github_variables) para o deploy automático."
