# Publica as imagens e o chart no GHCR (Packages do GitHub). Quem instala no cluster é o Flux (GitOps):
# ele acompanha o chart publicado e a configuração do ambiente em infra/gitops/<ambiente> e aplica sozinho.
# O GitHub não precisa de credenciais da AWS nem de variáveis de ambiente.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR (imagens e chart)

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Imagem ${{ matrix.component }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: core-service
            dockerfile: backend/core-service/Dockerfile
          - component: bff
            dockerfile: frontend/bff/Dockerfile
          - component: web
            dockerfile: frontend/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Nome do repositório em minúsculas (exigência do GHCR)
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    name: Chart (Flux aplica no cluster)
    needs: images
    runs-on: ubuntu-latest
    env:
      CHART_VERSION: 0.1.${{ github.run_number }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.1
      # O chart só é publicado depois das imagens: cada versão aponta (appVersion) para as imagens do mesmo build.
      - name: Publicar o chart no GHCR (OCI)
        run: |
          CHART_REPO="oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts"
          # Dashboards do Grafana: fonte única em observability/grafana/dashboards (local e cluster)
          mkdir -p infra/helm/fix/files/dashboards
          cp observability/grafana/dashboards/*.json infra/helm/fix/files/dashboards/
          cp observability/grafana/seed-dashboards.sh infra/helm/fix/files/
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package infra/helm/fix --version "$CHART_VERSION" --app-version "$IMAGE_TAG" --destination dist
          helm push "dist/fix-$CHART_VERSION.tgz" "$CHART_REPO"
          {
            echo "### Chart publicado: \`$CHART_REPO/fix:$CHART_VERSION\`"
            echo "- Imagens: \`$IMAGE_TAG\`"
            echo "- O Flux do cluster instala esta versão em até ~2 minutos (HelmRelease em \`infra/gitops/\`)."
            echo "- Acompanhe: \`kubectl -n fix get helmrelease fix\`"
          } >> "$GITHUB_STEP_SUMMARY"
