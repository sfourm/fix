{{- $name := include "fix.mongoHost" . }}
{{- $m := .Values.mongodb }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "mongodb") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "mongodb") | nindent 4 }}
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
# Arquivos enviados e as linhas de cada um (storage-service).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "mongodb") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "mongodb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "mongodb") | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: {{ $m.image }}
          args: ["--wiredTigerCacheSizeGB", {{ $m.cacheSizeGB | quote }}]
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ $m.username | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "fix.storageSecretsName" . }}, key: mongo-password }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $m.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $m.storage }}
