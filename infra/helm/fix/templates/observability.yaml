{{- if .Values.observability.enabled }}
{{- $o := .Values.observability }}
{{- $fullname := include "fix.fullname" . }}
{{- $collector := include "fix.collectorHost" . }}
{{- $prometheus := printf "%s-prometheus" $fullname }}
{{- $jaeger := printf "%s-jaeger" $fullname }}
{{- $grafana := printf "%s-grafana" $fullname }}
{{- $scheme := ternary "https" "http" .Values.ingress.tls.enabled }}
# Stack de observabilidade no cluster, equivalente a observability/ do repositório:
# apps → OTel Collector → Jaeger (traces) e Prometheus (métricas + span metrics) → Grafana.
---
# ---------- OpenTelemetry Collector ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $collector }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "otel-collector") | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      batch:
        timeout: 1s
        send_batch_size: 256
    connectors:
      # Métricas RED de cada span (rotas do BFF, gRPC, PostgreSQL, Redis, Elasticsearch)
      span_metrics:
        namespace: traces.span.metrics
        histogram:
          unit: ms
          explicit:
            buckets: [1ms, 2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
        dimensions:
          - name: http.route
          - name: http.request.method
          - name: http.response.status_code
          - name: rpc.service
          - name: rpc.method
          - name: rpc.grpc.status_code
          - name: grpc.status_code
          - name: db.system.name
          - name: db.operation.name
          - name: db.collection.name
        exemplars:
          enabled: true
        metrics_flush_interval: 5s
        metrics_expiration: 30m
    exporters:
      otlp_grpc/jaeger:
        endpoint: {{ $jaeger }}:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        send_timestamps: true
        enable_open_metrics: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/jaeger, span_metrics]
        metrics:
          receivers: [otlp, span_metrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $collector }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "otel-collector") | nindent 4 }}
spec:
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "otel-collector") | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, appProtocol: grpc }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: metrics, port: 8888, targetPort: 8888 }
    - { name: app-metrics, port: 8889, targetPort: 8889 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $collector }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "otel-collector") | nindent 8 }}
      annotations:
        # Reinicia a cada versão do chart (a configuração acima vive no template).
        fix/chart-version: {{ .Chart.Version | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: otel-collector
          image: {{ $o.collector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8888 }
            - { name: app-metrics, containerPort: 8889 }
          readinessProbe:
            tcpSocket: { port: otlp-grpc }
            periodSeconds: 10
          resources:
            {{- toYaml $o.collector.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
      volumes:
        - name: config
          configMap: { name: {{ $collector }} }
---
# ---------- Jaeger (traces em memória; UI em <grafana host>/jaeger) ----------
apiVersion: v1
kind: Service
metadata:
  name: {{ $jaeger }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "jaeger") | nindent 4 }}
spec:
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "jaeger") | nindent 4 }}
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317, appProtocol: grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $jaeger }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "jaeger") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "jaeger") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "jaeger") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: jaeger
          image: {{ $o.jaeger.image }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: SPAN_STORAGE_TYPE, value: memory }
            - { name: MEMORY_MAX_TRACES, value: {{ $o.jaeger.maxTraces | quote }} }
            - { name: QUERY_BASE_PATH, value: /jaeger }
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: admin, containerPort: 14269 }
          readinessProbe:
            httpGet: { path: /, port: admin }
            periodSeconds: 10
          resources:
            {{- toYaml $o.jaeger.resources | nindent 12 }}
---
# ---------- Prometheus ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $prometheus }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: otel-collector
        static_configs:
          - targets: ["{{ $collector }}:8888"]
      # honor_labels: o job de cada série é o serviço (fix-bff, fix-backend).
      - job_name: fix-services
        honor_labels: true
        static_configs:
          - targets: ["{{ $collector }}:8889"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $prometheus }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $prometheus }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  serviceName: {{ $prometheus }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ $o.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $o.prometheus.retention }}
            - --enable-feature=exemplar-storage
            - --web.enable-lifecycle
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $o.prometheus.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: {{ $prometheus }} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $o.prometheus.storage }}
---
# ---------- Grafana (provisionamento em grafana-provisioning.yaml) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $grafana }}-dashboards
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  # Links para a UI do Jaeger apontam para /jaeger no próprio host do Grafana; o Prometheus não é exposto (usa o Explore).
  {{ base $path }}: |
    {{- $.Files.Get $path | replace "http://localhost:16686" "/jaeger" | replace "http://localhost:9090" "/explore" | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  serviceName: {{ $grafana }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 8 }}
      annotations:
        # O Grafana só lê o provisionamento na inicialização: reinicia quando ele muda.
        checksum/provisioning: {{ include (print $.Template.BasePath "/grafana-provisioning.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ $o.grafana.image }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: {{ $o.grafana.adminUser | quote }} }
            - { name: GOMEMLIMIT, value: {{ $o.grafana.goMemLimit | quote }} }
            # Vale só na criação do banco do Grafana; depois, troque pela UI ou com grafana cli.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: grafana-admin-password }
            {{- with $o.grafana.host }}
            - { name: GF_SERVER_DOMAIN, value: {{ . | quote }} }
            - { name: GF_SERVER_ROOT_URL, value: "{{ $scheme }}://{{ . }}" }
            {{- end }}
            - { name: GF_SECURITY_COOKIE_SECURE, value: {{ .Values.ingress.tls.enabled | quote }} }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $o.grafana.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
      volumes:
        - name: provisioning
          configMap: { name: {{ $grafana }}-provisioning }
        - name: dashboards
          configMap: { name: {{ $grafana }}-dashboards }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $o.grafana.storage }}
{{- if and .Values.ingress.enabled $o.grafana.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $o.grafana.host | quote }}]
      secretName: {{ $grafana }}-tls
  {{- end }}
  rules:
    - host: {{ $o.grafana.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $grafana }}
                port: { name: http }
---
# UI do Jaeger em <grafana host>/jaeger: o ingress-nginx só libera quem tem sessão válida no Grafana (auth-url).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $jaeger }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "jaeger") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://{{ $grafana }}.{{ .Release.Namespace }}.svc.cluster.local:3000/api/user"
    nginx.ingress.kubernetes.io/auth-signin: "{{ $scheme }}://{{ $o.grafana.host }}/login"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ $o.grafana.host | quote }}
      http:
        paths:
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: {{ $jaeger }}
                port: { name: ui }
{{- end }}
{{- end }}
