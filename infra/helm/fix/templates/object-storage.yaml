{{- if eq .Values.objectStorage.provider "internal" }}
{{- $name := include "fix.s3Host" . }}
{{- $s := .Values.objectStorage }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "s3") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "s3") | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# S3 compatível (RustFS) com os arquivos originais dos uploads. Interno: o navegador baixa pelo BFF.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "s3") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "s3") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "s3") | nindent 8 }}
    spec:
      securityContext:
        # A imagem roda como rustfs (10001): o volume precisa ser gravável por esse grupo.
        fsGroup: 10001
      containers:
        - name: s3
          image: {{ $s.image }}
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "fix.storageSecretsName" . }}, key: s3-access-key }
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "fix.storageSecretsName" . }}, key: s3-secret-key }
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $s.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $s.storage }}
{{- end }}
