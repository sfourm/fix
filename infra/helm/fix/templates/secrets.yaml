{{- if .Values.secrets.create }}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.values.postgresPassword é obrigatório com secrets.create=true" $v.postgresPassword | quote }}
  session-secret: {{ required "secrets.values.sessionSecret é obrigatório com secrets.create=true" $v.sessionSecret | quote }}
  admin-email: {{ $v.adminEmail | quote }}
  admin-password: {{ required "secrets.values.adminPassword é obrigatório com secrets.create=true" $v.adminPassword | quote }}
{{- end }}
