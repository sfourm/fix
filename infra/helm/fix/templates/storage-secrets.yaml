{{- /*
Credenciais internas do storage-service (MongoDB, RabbitMQ e S3 do cluster). Nenhum desses serviços é exposto: as senhas
são geradas no primeiro deploy e reaproveitadas nos upgrades (lookup), para não trocar a senha de um volume já criado.
*/ -}}
{{- $name := include "fix.storageSecretsName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "storage-secrets") | nindent 4 }}
  annotations:
    # Desinstalar o chart não apaga as senhas dos volumes que continuam existindo.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongo-password: {{ get $data "mongo-password" | default (randAlphaNum 32 | b64enc) | quote }}
  rabbitmq-password: {{ get $data "rabbitmq-password" | default (randAlphaNum 32 | b64enc) | quote }}
  s3-access-key: {{ get $data "s3-access-key" | default (randAlphaNum 20 | b64enc) | quote }}
  s3-secret-key: {{ get $data "s3-secret-key" | default (randAlphaNum 40 | b64enc) | quote }}
