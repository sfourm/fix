{{- $name := include "fix.rabbitmqHost" . }}
{{- $r := .Values.rabbitmq }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fix.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
# Filas do processamento dos uploads (file.uploaded, file.line.received) e o progresso (file.progress) lido pelo BFF.
# StatefulSet: o nome do nó do RabbitMQ vem do hostname, que precisa ser estável para reaproveitar o volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fix.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fix.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ $r.image }}
          ports:
            - name: amqp
              containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ $r.username | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: {{ include "fix.storageSecretsName" . }}, key: rabbitmq-password }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $r.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $r.storage }}
