{{- if .Values.observability.enabled }}
{{- $fullname := include "fix.fullname" . }}
{{- $prometheus := printf "%s-prometheus" $fullname }}
{{- $jaeger := printf "%s-jaeger" $fullname }}
{{- $grafana := printf "%s-grafana" $fullname }}
# Provisionamento do Grafana (datasources e provedor de dashboards). Arquivo separado para o pod do Grafana
# reiniciar sozinho quando isto mudar (checksum/provisioning em observability.yaml): o Grafana só lê na inicialização.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $grafana }}-provisioning
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    # Recria as fontes pelo nome a cada start: os dashboards referenciam os uids fixos abaixo.
    deleteDatasources:
      - { name: Prometheus, orgId: 1 }
      - { name: Jaeger, orgId: 1 }
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $prometheus }}:9090
        isDefault: true
        editable: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: jaeger
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://{{ $jaeger }}:16686/jaeger
        editable: true
        jsonData:
          nodeGraph:
            enabled: true
          tracesToMetrics:
            datasourceUid: prometheus
            tags: [{ key: service.name, value: service_name }]
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: FIX Dashboards
        orgId: 1
        folder: FIX
        type: file
        disableDeletion: false
        editable: true
        # Salvar pela interface grava no banco do Grafana (volume persistente); o JSON do repositório volta a valer
        # quando mudar. Para manter uma edição: exporte para observability/grafana/dashboards e faça commit.
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
{{- end }}
