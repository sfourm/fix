{{- if .Values.observability.enabled }}
{{- $fullname := include "fix.fullname" . }}
{{- $prometheus := printf "%s-prometheus" $fullname }}
{{- $jaeger := printf "%s-jaeger" $fullname }}
{{- $grafana := printf "%s-grafana" $fullname }}
# Provisionamento do Grafana (datasources). Arquivo separado para o pod do Grafana
# reiniciar sozinho quando isto mudar (checksum/provisioning em observability.yaml): o Grafana só lê na inicialização.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $grafana }}-provisioning
  labels:
    {{- include "fix.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    # Recria as fontes pelo nome a cada start: os dashboards referenciam os uids fixos abaixo.
    deleteDatasources:
      - { name: Prometheus, orgId: 1 }
      - { name: Jaeger, orgId: 1 }
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $prometheus }}:9090
        isDefault: true
        editable: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: jaeger
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://{{ $jaeger }}:16686/jaeger
        editable: true
        jsonData:
          nodeGraph:
            enabled: true
          tracesToMetrics:
            datasourceUid: prometheus
            tags: [{ key: service.name, value: service_name }]
  # Dashboards não são provisionados por arquivo (o Grafana 12+ só deixaria baixar o JSON ao salvar): entram pela
  # API com o Job grafana-dashboards-seed, que só cria o que não existe. Assim ficam editáveis e salvos no banco.
{{- end }}
